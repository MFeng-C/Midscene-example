<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>双录自动化测试仪表盘</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00d4ff;
      font-size: 28px;
    }
    .panel {
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }
    .panel-title {
      font-size: 16px;
      color: #888;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .terminal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .terminal-btn {
      padding: 16px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #0f3460;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .terminal-btn:hover {
      border-color: #00d4ff;
      transform: translateY(-2px);
    }
    .terminal-btn.active {
      border-color: #00d4ff;
      background: #0f3460;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }
    .terminal-btn .icon {
      font-size: 24px;
      display: block;
      margin-bottom: 8px;
    }
    .scenario-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .scenario-btn {
      padding: 12px 16px;
      border: 2px solid #333;
      border-radius: 6px;
      background: #1a1a2e;
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }
    .scenario-btn:hover {
      border-color: #00d4ff;
      color: #fff;
    }
    .scenario-btn.active {
      border-color: #00d4ff;
      background: #0f3460;
      color: #fff;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #00d4ff;
      color: #1a1a2e;
      font-weight: bold;
    }
    .btn-primary:hover {
      background: #00b8e6;
    }
    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }
    .btn-danger:hover {
      background: #c0392b;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .log-container {
      background: #0d1117;
      border-radius: 8px;
      padding: 16px;
      height: 400px;
      overflow-y: auto;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .log-line {
      margin-bottom: 4px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-stdout { color: #aaa; }
    .log-stderr { color: #f39c12; }
    .log-error { color: #e74c3c; }
    .log-exit { color: #2ecc71; }
    .log-info { color: #3498db; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #0d1117;
      border-radius: 8px;
      margin-top: 16px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #666;
    }
    .status-dot.running {
      background: #2ecc71;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 双录自动化测试仪表盘</h1>

    <div class="panel">
      <div class="panel-title">选择终端</div>
      <div class="terminal-grid" id="terminalGrid"></div>
    </div>

    <div class="panel" id="scenarioPanel" style="display: none;">
      <div class="panel-title">选择场景</div>
      <div class="scenario-list" id="scenarioList"></div>
      <div class="controls">
        <button class="btn btn-primary" id="runBtn" onclick="runTest()">▶ 开始执行</button>
        <button class="btn btn-danger" id="stopBtn" onclick="stopTest()" disabled>■ 停止</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">执行日志</div>
      <div class="log-container" id="logContainer">
        <div class="log-line log-info">等待选择终端和场景...</div>
      </div>
      <div class="status-bar">
        <div class="status-indicator">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">就绪</span>
        </div>
        <span id="exitCode"></span>
      </div>
    </div>
  </div>

  <script>
    let selectedTerminal = null;
    let selectedScenario = null;
    let eventSource = null;
    let isRunning = false;

    async function loadTerminals() {
      const res = await fetch('/api/terminals');
      const { terminals } = await res.json();
      const grid = document.getElementById('terminalGrid');
      grid.innerHTML = terminals.map(t => `
        <button class="terminal-btn" onclick="selectTerminal('${t.id}')">
          <span class="icon">${getIcon(t.id)}</span>
          ${t.name}
        </button>
      `).join('');
    }

    function getIcon(id) {
      const icons = {
        android: '📱',
        ios: '📱',
        playwright: '💻',
        h5: '🌐'
      };
      return icons[id] || '🖥️';
    }

    async function selectTerminal(id) {
      selectedTerminal = id;
      selectedScenario = null;

      document.querySelectorAll('.terminal-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');

      const scenarioPanel = document.getElementById('scenarioPanel');
      scenarioPanel.style.display = 'block';

      const res = await fetch(`/api/scenarios?terminal=${id}`);
      const { scenarios } = await res.json();
      const list = document.getElementById('scenarioList');

      if (scenarios.length > 1 || (scenarios.length === 1 && scenarios[0].id !== 'default')) {
        list.innerHTML = scenarios.map(s => `
          <button class="scenario-btn" onclick="selectScenario('${s.id}', '${s.name}')">${s.name}</button>
        `).join('');
      } else {
        list.innerHTML = '<div class="log-line log-info">该终端使用默认配置</div>';
      }

      clearLog();
      addLog('info', `已选择终端: ${id}`);
    }

    function selectScenario(id, name) {
      selectedScenario = id;
      document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');
      addLog('info', `已选择场景: ${name}`);
    }

    function addLog(type, message) {
      const container = document.getElementById('logContainer');
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      container.appendChild(line);
      container.scrollTop = container.scrollHeight;
    }

    function clearLog() {
      document.getElementById('logContainer').innerHTML = '';
    }

    function setStatus(running, text) {
      isRunning = running;
      const dot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const runBtn = document.getElementById('runBtn');
      const stopBtn = document.getElementById('stopBtn');

      dot.className = running ? 'status-dot running' : 'status-dot';
      statusText.textContent = text;
      runBtn.disabled = running || !selectedTerminal;
      stopBtn.disabled = !running;
    }

    function runTest() {
      if (!selectedTerminal) return;

      clearLog();
      setStatus(true, '执行中...');
      addLog('info', `启动测试: ${selectedTerminal}${selectedScenario ? ' / ' + selectedScenario : ''}`);

      const url = `/api/run-test?terminal=${selectedTerminal}${selectedScenario ? '&scenario=' + selectedScenario : ''}`;
      eventSource = new EventSource(url);

      eventSource.onmessage = (e) => {
        const data = JSON.parse(e.data);
        if (data.type === 'stdout') {
          addLog('stdout', data.message.trim());
        } else if (data.type === 'stderr') {
          addLog('stderr', data.message.trim());
        } else if (data.type === 'error') {
          addLog('error', data.message);
        } else if (data.type === 'exit') {
          addLog(data.code === 0 ? 'exit' : 'error', data.message);
          document.getElementById('exitCode').textContent = `退出码: ${data.code}`;
          setStatus(false, data.code === 0 ? '已完成' : '已结束');
          eventSource.close();
        } else if (data.type === 'info') {
          addLog('info', data.message);
        }
      };

      eventSource.onerror = () => {
        addLog('error', '连接中断');
        setStatus(false, '连接错误');
        eventSource.close();
      };
    }

    async function stopTest() {
      if (!isRunning) return;
      addLog('info', '正在停止测试...');
      await fetch('/api/stop-test', { method: 'POST' });
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      setStatus(false, '已停止');
      addLog('info', '测试已停止');
    }

    loadTerminals();
    setStatus(false, '就绪');
  </script>
</body>
</html>
